version = 1

[device]
address = ""
auto_connect = true
reconnect_initial_ms = 1000
reconnect_max_ms = 15000

[audio]
node_name = "rc003-omarchy"
description = "RC003 Remote Microphone"
gain_db = 0.0
release_drain_ms = 0
frame_layout = "raw"
frame_timeout_secs = 5
keep_alive_secs = 10
mic_on_demand = false

[input]
enabled = true
voice_key = "RightAlt"
release_grab_on_exit = true

[mapping]
enabled = true
profile = "default"
# Optional per-key output overrides (use "None" to disable a key):
# [mapping.keys]
# power = "Esc"
# home = "F13"
# menu = "F14"
# tv = "F15"

[logging]
level = "info"
